name: restore-run-sh-exec
on:
  push:
    branches: [decode]
  workflow_dispatch:
jobs:
  chmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decode
          fetch-depth: 1
      - name: Restore run.sh 100755
        run: |
          set -euo pipefail
          mode=$(git ls-tree HEAD run.sh | awk '{print $1}')
          echo "current mode=$mode"
          if [ "$mode" = 100755 ]; then
            echo already executable
            exit 0
          fi
          git update-index --chmod=+x run.sh
          git config user.name "sfxnz"
          git config user.email "sufyan.101@icloud.com"
          git commit -m "Restore executable bit on run.sh."
          git push origin HEAD:decode
