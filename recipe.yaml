# Source of truth. Edit here, then `python3 kit/render.py`.
model:
  id: &model sfxnz/DeepSeek-V4.1-Flash-EXL3
  revision: &revision 2.0bpw-mcg-viterbi-lmhead-mxfp8
  served_name: &served_name deepseek-ai/DeepSeek-V4.1-Flash
  family: DeepSeek-V4.1-Flash
  params: 552B backbone / 8B prefill / 16B decode, plus 196B Engram
  quant: EXL3 2.0 bpw routed experts, source MXFP8/MXFP4 elsewhere, Engram on NVMe

image:
  base: vllm/vllm-openai:deepseekv41-flash-0909
  digest: sha256:d84a123255b822fc22508635218000187221794f59c0694c33b0650d1e377d58
  local_tag: &image dsv41-flash-exl3-sm121:canonical-e14
  build: docker/Dockerfile

engine:
  name: vllm
  version: dsv41-flash-0909 + vllm-exl3 native p2b (cb=1 MCG / cb=2 MUL1) + Engram-on-disk

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: dsv41-flash-exl3
    PORT: 8000
    MASTER_PORT: 29524
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 1048576
    MAX_NUM_SEQS: 2
    UTIL: 0.75
    KV_CACHE_DTYPE: fp8
    KV_CACHE_MEMORY: 8589934592
    BLOCK_SIZE: 64
    NUM_SPECULATIVE_TOKENS: 3
    SPEC: dspark
    LOAD_FORMAT: auto
    QUANTIZATION: exl3
    DSV41_ENGRAM_DISK: 1
    LANGUAGE_MODEL_ONLY: 0
    MM_ENCODER_TP_MODE: data
    MAX_NUM_BATCHED_TOKENS: 8192
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_ENGRAM: 0
    FORCE_UNSAFE_QUANT: 0
    ENFORCE_EAGER: 0
    DSV41_ALLOW_CUDA_GRAPHS: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 1
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    ORCHESTRATE: auto
    AUDIT: warn
    WARMUP: 1
    EXTRA_ARGS: ""
    DSV41_ENGRAM_PREFETCH: 1
    DSV41_ENGRAM_CENSUS: 1
    DSV41_ENGRAM_GATHER_V2: 1
    DSV41_ENGRAM_WILLNEED: 1
    DSV41_LMHEAD_MXFP8: 1
    DSV41_STREAM_FEED: 1
    DSV41_WOA_PREPACK: 1
    DSV41_DSPARK_SPARSE_MARKOV: 1
    DSV41_DSPARK_SPARSE_MARKOV_TOPK: 1024
    DSV41_P2B_COOP: 2
    DSV41_DENSE_GEMV: 1
    DSV41_MHC_DET_SPLITS: 16
    DSV41_ENGRAM_NATIVE_STAGE: 1
    DSV41_ENGRAM_EARLY_HASH: 1
    DSV41_ATTN_T2R_DEDUP: 1
    DSV41_SWA_META_FUSED: 1
    DSV41_MOE_PREP_FUSED: 1
    DSV41_CANDIDATE_MASK_BOUNDED: 1
    DSV41_INDEXER_WP_GEMV: 1
    NCCL_BUFFSIZE: 1048576
    NCCL_LL128_BUFFSIZE: 262144
    NCCL_PROTO: ^LL128
    NCCL_MAX_NCHANNELS: 8
    DSV41_DROP_PAGE_CACHE: 1
    DSV41_INDEXER_PREFILL_FACTOR: 1
    DSV41_PREFILL_EMPTY_CACHE_TOKENS: 8192
    DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB: 2.5
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: 256

readme:
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}` revision `{SNAPSHOT_SHA}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "{KV_CACHE_MEMORY}"
    - "`--quantization`": "`{QUANTIZATION}`"
    - Engram: "disk (`DSV41_ENGRAM_DISK={DSV41_ENGRAM_DISK}`)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - Speculative: "DSpark-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`)"
    - CUDA graphs: "`FULL_AND_PIECEWISE`, capture sizes {1} ∪ {s·k, s·(k+1)} for s ≤ `--max-num-seqs` (`[1,3,4,6,8]` at k=3) (`ENFORCE_EAGER={ENFORCE_EAGER}`, `DSV41_ALLOW_CUDA_GRAPHS={DSV41_ALLOW_CUDA_GRAPHS}`)"
    - Engram prefetch / census / gather: "`DSV41_ENGRAM_PREFETCH={DSV41_ENGRAM_PREFETCH}` `DSV41_ENGRAM_CENSUS={DSV41_ENGRAM_CENSUS}` `DSV41_ENGRAM_GATHER_V2={DSV41_ENGRAM_GATHER_V2}`"
    - Engram prefill read-ahead: "`DSV41_ENGRAM_WILLNEED={DSV41_ENGRAM_WILLNEED}` (gv2 calls with >= 512 rows fadvise their pages before the preadv loop)"
    - lm_head: "MXFP8 (`DSV41_LMHEAD_MXFP8={DSV41_LMHEAD_MXFP8}`), needs an lm_head-MXFP8 pack (`{SNAPSHOT_SHA}` or `2.0bpw-mcg-lmhead-mxfp8`); self-disarms on stock `2.0bpw-mcg`"
    - Weight-load stream feed: "`DSV41_STREAM_FEED={DSV41_STREAM_FEED}`"
    - Decode levers: "`DSV41_WOA_PREPACK={DSV41_WOA_PREPACK}` (needs the `{IMAGE}` o_proj stage) `DSV41_DSPARK_SPARSE_MARKOV={DSV41_DSPARK_SPARSE_MARKOV}` `DSV41_DSPARK_SPARSE_MARKOV_TOPK={DSV41_DSPARK_SPARSE_MARKOV_TOPK}`"
    - Round-3 kernel bundle: "`DSV41_P2B_COOP={DSV41_P2B_COOP}` (coop dataflow MoE kernel, needs the `{IMAGE}` build) `DSV41_DENSE_GEMV={DSV41_DENSE_GEMV}` `DSV41_MHC_DET_SPLITS={DSV41_MHC_DET_SPLITS}` `DSV41_ENGRAM_NATIVE_STAGE={DSV41_ENGRAM_NATIVE_STAGE}` `DSV41_ENGRAM_EARLY_HASH={DSV41_ENGRAM_EARLY_HASH}` `DSV41_ATTN_T2R_DEDUP={DSV41_ATTN_T2R_DEDUP}` `DSV41_SWA_META_FUSED={DSV41_SWA_META_FUSED}` `DSV41_MOE_PREP_FUSED={DSV41_MOE_PREP_FUSED}` `DSV41_CANDIDATE_MASK_BOUNDED={DSV41_CANDIDATE_MASK_BOUNDED}` `DSV41_INDEXER_WP_GEMV={DSV41_INDEXER_WP_GEMV}` (set one to `0` to turn it off)"
    - NCCL AR-tail set: "`NCCL_BUFFSIZE={NCCL_BUFFSIZE}` `NCCL_LL128_BUFFSIZE={NCCL_LL128_BUFFSIZE}` `NCCL_PROTO={NCCL_PROTO}` `NCCL_MAX_NCHANNELS={NCCL_MAX_NCHANNELS}`"
    - Memory hygiene: "`DSV41_DROP_PAGE_CACHE={DSV41_DROP_PAGE_CACHE}` `DSV41_INDEXER_PREFILL_FACTOR={DSV41_INDEXER_PREFILL_FACTOR}` `DSV41_PREFILL_EMPTY_CACHE_TOKENS={DSV41_PREFILL_EMPTY_CACHE_TOKENS}` `DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB={DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB}` `VLLM_SPARSE_INDEXER_MAX_LOGITS_MB={VLLM_SPARSE_INDEXER_MAX_LOGITS_MB}`"
    - Tokenizers / tools / reasoning: "`deepseek_v41`"
    - Vision: "on (`LANGUAGE_MODEL_ONLY={LANGUAGE_MODEL_ONLY}`)"
    - "`--mm-encoder-tp-mode`": "{MM_ENCODER_TP_MODE}"
    - Default thinking: "`thinking=false`, `reasoning_effort=low`"
    - Post-ready: "engagement audit of both ranks' logs (`AUDIT={AUDIT}`; `strict` fails the boot, `off` skips), then greedy, t=0.7, ~3k/~1k/~300-token nonce prefill and small-image warmup requests (`WARMUP={WARMUP}`)"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  decode:
    conditions: "Round 36 (2026-09-27, results/2026-09-27-viterbi-adopt/): pooled V-1 and V-2, 2 boots of the identical round-36 default config, i.e. the round-35 config (image canonical-e14 = sha256:3a002b55c9bc, DSpark-3 greedy verify + captures [1,3,4,6,8], the round-34 set (Engram prefetch v3 + census + gather v2 + WILLNEED, NCCL AR-tail set, mem-hygiene bundle, lm_head mxfp8, STREAM_FEED, WOA_PREPACK, SPARSE_MARKOV), the round-3 kernel bundle and SPARSE_MARKOV_TOPK=1024, vision on, Engram on disk) on the Viterbi pack 2.0bpw-mcg-viterbi-lmhead-mxfp8, each booted with `AUDIT=strict ./run.sh` and no lever/pack/image env (strict audit clean, gpu_guard clean, disarm_scan rc 0). Each row is the median of the per-run values pooled over the two boots (round36-compute.py.txt -> round36-headline.json, pooled.V; same method as round 35's round35-headline-compute.py.txt). bench_decode.py = streamed greedy 200 tokens thinking off, 9 runs per boot (pooled n=18; c=2 per-stream n=36), ignore_eos (prose post-EOS about 0.6); L.A.I.L prose = tools/measure_lail_prose.py 512 tokens temperature 0.2, 10 runs per boot (pooled n=20). Per boot: L.A.I.L 42.73 / 42.44, prose c=1 50.26 / 51.12, structured c=1 84.37 / 84.19. Round-35 final config on the previous pack 2.0bpw-mcg-lmhead-mxfp8 (S1024-1, S1024-2, final-1, pooled the same way): L.A.I.L 42.98, prose c=1 52.97, structured c=1 83.73, prose c=2 agg 81.73, structured c=2 agg 138.34. Quality: V-1 recorded the new baseline (quality-baseline/); V-2 quick and full PASS against it. History: results/RESULTS.md rounds 1-36."
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: "50.41", aggregate: "50.39", ttft_p50: "0.23", evidence: results/2026-09-27-viterbi-adopt/round36-headline.json}
      - {phase: prose, concurrency: 2, decode: "41.57", aggregate: "81.02", ttft_p50: "0.25", evidence: results/2026-09-27-viterbi-adopt/round36-headline.json}
      - {phase: structured, concurrency: 1, decode: "84.20", aggregate: "84.18", ttft_p50: "0.21", evidence: results/2026-09-27-viterbi-adopt/round36-headline.json}
      - {phase: structured, concurrency: 2, decode: "78.17", aggregate: "156.29", ttft_p50: "0.23", evidence: results/2026-09-27-viterbi-adopt/round36-headline.json}
      - {phase: lail_prose, concurrency: 1, decode: "42.58", aggregate: "42.58", ttft_p50: "0.32", evidence: results/2026-09-27-viterbi-adopt/round36-headline.json}

