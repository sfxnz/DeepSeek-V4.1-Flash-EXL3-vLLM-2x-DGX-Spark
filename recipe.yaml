# Source of truth. Edit here, then `python3 kit/render.py`.
model:
  id: &model sfxnz/DeepSeek-V4.1-Flash-EXL3
  revision: &revision 2.0bpw-mcg
  served_name: &served_name deepseek-ai/DeepSeek-V4.1-Flash
  family: DeepSeek-V4.1-Flash
  params: 552B backbone / 8B prefill / 16B decode, plus 196B Engram
  quant: EXL3 2.0 bpw routed experts, source MXFP8/MXFP4 elsewhere, Engram on NVMe

image:
  base: vllm/vllm-openai:deepseekv41-flash-0909
  digest: sha256:d84a123255b822fc22508635218000187221794f59c0694c33b0650d1e377d58
  local_tag: &image dsv41-flash-exl3-sm121
  canonical_tag: dsv41-flash-exl3-sm121:canonical-e12
  build: docker/Dockerfile

engine:
  name: vllm
  version: dsv41-flash-0909 + vllm-exl3 native p2b (cb=1 MCG / cb=2 MUL1) + Engram-on-disk

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: dsv41-flash-exl3
    PORT: 8000
    MASTER_PORT: 29524
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 1048576
    MAX_NUM_SEQS: 2
    UTIL: 0.75
    KV_CACHE_DTYPE: fp8
    KV_CACHE_MEMORY: 8589934592
    BLOCK_SIZE: 64
    NUM_SPECULATIVE_TOKENS: 5
    SPEC: dspark
    LOAD_FORMAT: auto
    QUANTIZATION: exl3
    DSV41_ENGRAM_DISK: 1
    LANGUAGE_MODEL_ONLY: 0
    MM_ENCODER_TP_MODE: data
    MAX_NUM_BATCHED_TOKENS: 2048
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_ENGRAM: 0
    FORCE_UNSAFE_QUANT: 0
    ENFORCE_EAGER: 0
    DSV41_ALLOW_CUDA_GRAPHS: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 1
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    ORCHESTRATE: auto
    EXTRA_ARGS: ""

readme:
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}` revision `{SNAPSHOT_SHA}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "{KV_CACHE_MEMORY}"
    - "`--quantization`": "`{QUANTIZATION}`"
    - Engram: "disk (`DSV41_ENGRAM_DISK={DSV41_ENGRAM_DISK}`)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - Speculative: "DSpark-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`)"
    - CUDA graphs: "`FULL_AND_PIECEWISE` (`ENFORCE_EAGER={ENFORCE_EAGER}`, `DSV41_ALLOW_CUDA_GRAPHS={DSV41_ALLOW_CUDA_GRAPHS}`)"
    - Tokenizers / tools / reasoning: "`deepseek_v41`"
    - Vision: "on (`LANGUAGE_MODEL_ONLY={LANGUAGE_MODEL_ONLY}`)"
    - "`--mm-encoder-tp-mode`": "{MM_ENCODER_TP_MODE}"
    - Default thinking: "`thinking=false`, `reasoning_effort=low`"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  decode:
    conditions: "Capture 2026-09-19 rounds 6-11 on the E11 config (E10+E11 keeps: p2b funnelshift extraction, b12x (16,64) small-m tiles, o_proj wo_a exact-requant onto the fp8 einsum) plus round-11 parallel Engram staging (DSV41_ENGRAM_FAST_STAGE=1, default on since run.sh). KV pool 8 GiB, DSpark-5 greedy, CUDA graphs, vision on, Engram on disk, native p2b CFG=1. bench_decode.py prose phase = streamed greedy 200 tokens thinking off; L.A.I.L prose = 512 tokens temperature 0.2. Prose evidence: results/2026-09-19-e11/cells.log; lail_prose evidence after round-11 fast staging: results/2026-09-19-faststage/02-e2e.log; history in results/RESULTS.md."
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: "34.3", aggregate: "34.3", ttft_p50: "0.29", evidence: results/2026-09-19-e11/cells.log}
      - {phase: lail_prose, concurrency: 1, decode: "25.4", aggregate: "25.4", ttft_p50: "0.34", evidence: results/2026-09-19-faststage/02-e2e.log}

links:
  model: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  pack: https://huggingface.co/sfxnz/DeepSeek-V4.1-Flash-EXL3
  base_image: https://hub.docker.com/r/vllm/vllm-openai
  repo: https://github.com/sfxnz/DeepSeek-V4.1-Flash-EXL3-vLLM-2x-DGX-Spark
